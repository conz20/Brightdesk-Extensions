name: Brightdesk Extensions quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Verify extension manifest and permission contracts
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out Brightdesk Extensions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout action
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node action
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify the required Node.js runtime
        run: npm run check:node
      - name: Check manifest verifier syntax
        run: npm run check
      - name: Run manifest and permission regression tests
        run: npm test
      - name: Verify the example manifest
        working-directory: examples/basic-extension
        run: node ../../scripts/verify-extension-manifest.mjs
